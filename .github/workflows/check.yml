name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.12.18"
          enable-cache: true
      - run: timeout 300s uv sync --locked --all-packages --group hacs
      - run: timeout 60s uv run --no-sync ruff check .
      - run: timeout 60s uv run --no-sync ruff format --check .
      - run: timeout 120s uv run --no-sync python -m unittest discover -s tests -v
      - run: timeout 120s uv run --no-sync python -m unittest discover -s packages/entr-ble-cli/tests -v
      - run: timeout 120s uv build --all-packages --no-sources
