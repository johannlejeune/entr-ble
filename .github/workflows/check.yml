name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv sync --locked --all-packages --group hacs
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync basedpyright

  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: library
            directory: tests
            pattern: test_library*.py
          - package: CLI
            directory: packages/entr-ble-cli/tests
            pattern: test_*.py
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv sync --locked --all-packages --no-dev
      - name: Run tests
        env:
          TEST_DIRECTORY: ${{ matrix.directory }}
          TEST_PATTERN: ${{ matrix.pattern }}
        run: uv run --no-sync python -m unittest discover -s "$TEST_DIRECTORY" -p "$TEST_PATTERN" -v

  homeassistant:
    name: Test Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv sync --locked --all-packages --group hacs --no-dev
      - run: uv run --no-sync python -m unittest discover -s tests -p test_hacs.py -v

  build:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
      - run: uv build --all-packages --no-sources
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: python-packages
          path: dist/*
          if-no-files-found: error

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate integration
        run: docker run --rm -v "$GITHUB_WORKSPACE:/github/workspace" ghcr.io/home-assistant/hassfest:2026.9.3

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@22.5.0
        with:
          category: integration
          comment: false
