name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to retry (leave empty to update the release PR)
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.release.outputs.tag_name || steps.retry.outputs.tag }}
      sha: ${{ steps.release.outputs.sha || steps.retry.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        if: inputs.tag == ''
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
      - uses: actions/checkout@v7.0.1
        if: steps.release.outputs.pr != ''
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.release.outputs.pr != ''
      - name: Synchronize release PR
        if: steps.release.outputs.pr != ''
        run: |
          uv run --no-project --with tomlkit==0.15.1 .github/scripts/sync-release.py
          uv lock
          git add -- packages/entr-ble-cli/pyproject.toml custom_components/entr_ble/manifest.json uv.lock
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: synchronize release versions'
            git push
          fi
      - name: Resolve draft release for retry
        id: retry
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          release=$(gh release view "$RELEASE_TAG" --json tagName,targetCommitish,isDraft)
          test "$(jq -r .isDraft <<< "$release")" = true
          echo "tag=$(jq -r .tagName <<< "$release")" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .targetCommitish <<< "$release")" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  publish:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: entr_ble
            environment: pypi
          - distribution: entr_ble_cli
            environment: pypi-cli
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/download-artifact@v8.0.1
        with:
          name: python-packages
          path: dist
      - name: Publish Python package
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/"$DISTRIBUTION"-*

  release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: python-packages
          path: dist
      - name: Wait for both versions on PyPI
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          version=${RELEASE_TAG#v}
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 10 "https://pypi.org/pypi/entr-ble/$version/json" > /dev/null &&
               curl --fail --silent --max-time 10 "https://pypi.org/pypi/entr-ble-cli/$version/json" > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo 'Both packages are not available on PyPI yet.' >&2
          exit 1
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
